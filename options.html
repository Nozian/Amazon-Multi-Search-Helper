<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon Toolkit の検索先設定</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#213347;font:14px system-ui,-apple-system,sans-serif}header{background:#1b3048;color:#fff;padding:32px max(22px,calc((100vw - 750px)/2))}h1{margin:0;font-size:24px}header p{color:#c7d6e5;font-size:13px}main{max-width:750px;margin:20px auto;padding:0 18px}.panel{border:1px solid #dce5ee;background:#fff;padding:23px;border-radius:13px}h2{font-size:17px;margin:0 0 8px}.lead{color:#667a90;font-size:12px;line-height:1.7}.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:20px 0}.sites label{display:flex;gap:9px;align-items:center;border:1px solid #e3ebf2;border-radius:8px;padding:9px 11px;cursor:pointer}.sites label:hover{background:#f7f9fd}input{accent-color:#d78a2b}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border-radius:7px;border:0;cursor:pointer;background:#e69b38;color:#192a3d;font-weight:750}button.muted{background:#e7edf5}#status{margin:13px 0 0;color:#326d56;min-height:22px;font-size:12px}.note{font-size:12px;color:#6d7e92;line-height:1.6}
</style></head><body><header><h1>Amazon Toolkit の設定</h1><p>Amazonの商品ページ・検索結果・カート・ほしい物リストに表示する検索先を選ぶ</p></header><main><div class="panel"><h2>横断検索するサイト</h2><p class="lead">変更後は保存してください。開いているAmazonページにも反映します。旧拡張との設定の自動同期はありません。</p><div class="actions"><button type="button" class="muted" id="all">すべて選択</button><button type="button" class="muted" id="none">すべて解除</button></div><div class="sites" id="sites"></div><button id="save">検索先の設定を保存</button><p id="status" role="status"></p><p class="note">この拡張はAmazon公式ではありません。検索先は外部サイトへリンクするだけで、ログイン情報は取得しません。外部サイト側の検索仕様変更で一部リンクが使えなくなる場合があります。</p></div></main><script src="sites.js"></script><script src="options.js"></script></body></html>
